<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MarketMind</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 30px 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 {
            font-size: 18px;
            color: #f1f5f9;
            margin-bottom: 15px;
        }
        .grid-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #6366f1;
        }
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background .2s;
            width: 100%;
        }
        .btn:hover {
            background: #4f46e5;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
        .table-container {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #334155;
            color: #f1f5f9;
            padding: 14px;
            font-weight: 600;
        }
        td {
            padding: 14px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending {
            background: #f59e0b22;
            color: #fbbf24;
        }
        .badge-approved {
            background: #10b98122;
            color: #34d399;
        }
        .btn-table {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-approve {
            background: #10b981;
            color: white;
        }
        .btn-approve:hover {
            background: #059669;
        }
        .btn-disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ Panel de Control Global - MarketMind</h1>

    <div class="grid-config">
        
        <div class="card" style="border-left: 4px solid #6366f1;">
            <h2>🔧 Modificar Ajustes Generales</h2>
            <div style="margin-top: 15px;">
                <div class="form-group">
                    <label>Monto Mínimo de Recarga (S/):</label>
                    <input type="number" id="cfg-monto-min">
                </div>
                <div class="form-group">
                    <label>Mensaje de Alerta en Depósitos:</label>
                    <input type="text" id="cfg-mensaje">
                </div>
                <div class="form-group">
                    <label>Modo Mantenimiento de la Web:</label>
                    <select id="cfg-mantenimiento">
                        <option value="false">🟢 Operativo (App Abierta)</option>
                        <option value="true">🔴 En Mantenimiento (Bloquear App)</option>
                    </select>
                </div>
                <button class="btn" onclick="guardarConfiguracion()">Guardar Parámetros</button>
            </div>
        </div>

        <div class="card" style="border-left: 4px solid #10b981;">
            <h2>📦 Publicar Nueva Tarea (Pedido)</h2>
            <div style="margin-top: 15px;">
                <div class="form-group">
                    <label>Nombre del Producto Comercial:</label>
                    <input type="text" id="task-name" placeholder="Ej: Nintendo Switch OLED">
                </div>
                <div class="form-group">
                    <label>Enlace/URL de la Imagen (Link de Internet):</label>
                    <input type="text" id="task-img" placeholder="https://enlace.com/imagen.jpg">
                </div>
                <button class="btn btn-success" onclick="crearNuevaTarea()">➕ Añadir al Catálogo de Tareas</button>
            </div>
        </div>

    </div>

    <div class="card">
        <h2 style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <span>💰 Solicitudes de Recarga (Yape / Plin)</span>
            <button onclick="obtenerSolicitudesRecarga()" class="btn" style="width: auto; padding: 6px 12px; font-size: 12px; background: #334155;">🔄 Actualizar Lista</button>
        </h2>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Usuario (Teléfono)</th>
                        <th>Monto Declarado</th>
                        <th>N° de Operación</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-recargas-body">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #94a3b8;">Cargando solicitudes desde el servidor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 1. Obtener la configuración actual al abrir la página para rellenar las cajas de texto
    async function obtenerConfiguracionActual() {
        try {
            const res = await fetch('/api/configuracion');
            const config = await res.json();
            
            document.getElementById('cfg-monto-min').value = config.montoMinimoRecarga;
            document.getElementById('cfg-mensaje').value = config.mensajeAlerta;
            document.getElementById('cfg-mantenimiento').value = config.mantenimiento.toString();
        } catch (e) {
            console.error("Error cargando configuración inicial", e);
        }
    }

    // 2. Guardar los datos del negocio modificados en el servidor
    async function guardarConfiguracion() {
        const montoMinimo = document.getElementById('cfg-monto-min').value;
        const nuevoMensaje = document.getElementById('cfg-mensaje').value;
        const enMantenimiento = document.getElementById('cfg-mantenimiento').value === "true";

        try {
            const res = await fetch('/api/admin/actualizar-configuracion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ montoMinimo, nuevoMensaje, enMantenimiento })
            });
            const resultado = await res.json();
            alert(resultado.mensaje);
        } catch (e) {
            alert("Error al actualizar la configuración.");
        }
    }

    // 3. Registrar una nueva tarea en el catálogo rotativo del servidor
    async function crearNuevaTarea() {
        const nombre = document.getElementById('task-name').value.trim();
        const imagenUrl = document.getElementById('task-img').value.trim();

        if (!nombre || !imagenUrl) {
            alert("Por favor completa el nombre del producto y la URL de la imagen.");
            return;
        }

        try {
            const res = await fetch('/api/admin/agregar-tarea', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, imagenUrl })
            });
            const resultado = await res.json();
            
            if (resultado.mensaje) {
                alert(resultado.mensaje);
                document.getElementById('task-name').value = "";
                document.getElementById('task-img').value = "";
            } else {
                alert("Ocurrió un inconveniente: " + resultado.error);
            }
        } catch (e) {
            alert("Error de comunicación con el backend.");
        }
    }

    // 4. Descargar todas las órdenes de depósito hechas por tus usuarios
    async function obtenerSolicitudesRecarga() {
        try {
            const res = await fetch('/api/admin/recargas');
            const solicitudes = await res.json();
            
            const tablaBody = document.getElementById('tabla-recargas-body');
            tablaBody.innerHTML = ""; // Limpiar tabla vieja
            
            if (solicitudes.length === 0) {
                tablaBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8;">Aún no se registran depósitos en la plataforma.</td></tr>`;
                return;
            }

            // Renderizar de las más nuevas a las más antiguas
            solicitudes.reverse().forEach(solicitud => {
                const esPendiente = solicitud.estado === 'pendiente';
                
                const estadoBadge = esPendiente 
                    ? `<span class="badge badge-pending">Pendiente</span>` 
                    : `<span class="badge badge-approved">Aprobado</span>`;
                
                const botonAccion = esPendiente 
                    ? `<button class="btn-table btn-approve" onclick="aprobarDeposito('${solicitud.id}')">Aprobar Pago</button>` 
                    : `<button class="btn-table btn-disabled" disabled>Validado</button>`;

                tablaBody.innerHTML += `
                    <tr>
                        <td><strong>+51 ${solicitud.telefono}</strong></td>
                        <td style="color:#22c55e; font-weight:600;">S/ ${solicitud.monto.toFixed(2)}</td>
                        <td><code>${solicitud.numOperacion}</code></td>
                        <td>${estadoBadge}</td>
                        <td>${botonAccion}</td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error leyendo lista de recargas", e);
        }
    }

    // 5. Enviar orden al servidor para sumarle el dinero al usuario
    async function aprobarDeposito(id) {
        if(!confirm("¿Confirmas que validaste este número de operación en tu cuenta bancaria real?")) return;

        try {
            const res = await fetch('/api/admin/aprobar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ solicitudId: id })
            });
            const resultado = await res.json();
            
            if(resultado.mensaje) {
                alert(resultado.mensaje);
                obtenerSolicitudesRecarga(); // Refrescar tabla automáticamente
            } else {
                alert("Error: " + resultado.error);
            }
        } catch (e) {
            alert("No se pudo conectar para procesar la aprobación.");
        }
    }

    // Carga automática inicial de datos del servidor al entrar al panel
    obtenerConfiguracionActual();
    obtenerSolicitudesRecarga();
    
    // Auto-actualizar la lista de depósitos cada 15 segundos para no tener que presionar el botón siempre
    setInterval(obtenerSolicitudesRecarga, 15000);
</script>
</body>
</html>
