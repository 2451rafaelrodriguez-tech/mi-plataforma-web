<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MarketMind</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{
  --primary:#6c3bff;--primary-dark:#4e22e0;--primary-light:#ede8ff;--primary-pale:#f5f2ff;
  --accent:#ff6b35;--accent-light:#fff0eb;
  --gold:#f5b942;--gold-dark:#d4941a;
  --green:#22c55e;--red:#ef4444;
  --bg:#f4f3f8;--white:#fff;
  --text:#16142b;--text-mid:#5a587a;--text-light:#a09ebb;
  --border:#e8e6f0;
  --shadow:0 2px 12px rgba(108,59,255,.10);
  --shadow-md:0 6px 28px rgba(108,59,255,.16);
  --r:14px;--r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;}
 
/* ── PAGE ── */
.page{width:100%;max-width:480px;background:var(--white);min-height:100vh;display:none;flex-direction:column;padding-bottom:72px;animation:fadeUp .2s ease;}
.page.active{display:flex;}
.page.auth{padding-bottom:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 
/* ── AUTH ── */
.auth-wrap{padding:0 24px 40px;background:linear-gradient(160deg,#f0ebff 0%,#fff 50%);min-height:100vh;}
.auth-top{display:flex;align-items:center;padding-top:16px;min-height:52px;}
.back-btn{background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary);transition:background .15s;}
.back-btn:hover{background:var(--primary-light);}
.back-btn svg{width:22px;height:22px;fill:currentColor;}
 
.logo-area{text-align:center;padding:28px 0 24px;}
.logo-mark{width:74px;height:74px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:22px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(108,59,255,.35);margin-bottom:14px;}
.logo-mark svg{width:40px;height:40px;fill:white;}
.logo-name{font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px;}
.logo-name span{color:var(--primary);}
.logo-ruc{font-size:11px;color:var(--text-light);margin-top:3px;}
 
.auth-heading{margin-bottom:20px;}
.auth-heading h2{font-size:22px;font-weight:700;color:var(--text);}
.auth-heading p{font-size:13px;color:var(--text-light);margin-top:3px;}
 
.field-lbl{font-size:11px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;}
.input-row{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--white);height:50px;padding:0 14px;transition:border-color .2s,box-shadow .2s;}
.input-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,59,255,.1);}
.input-pfx{font-size:14px;font-weight:600;color:var(--primary);margin-right:10px;padding-right:10px;border-right:1.5px solid var(--border);white-space:nowrap;}
.input-row input, .input-row select{border:none;outline:none;flex:1;font-size:15px;color:var(--text);background:transparent;font-family:inherit;}
.input-row select{cursor:pointer; -webkit-appearance:none;}
.input-row input::placeholder{color:var(--text-light);}
 
.btn-main{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;width:100%;height:50px;border-radius:var(--r-sm);font-size:16px;font-weight:700;cursor:pointer;margin-top:22px;box-shadow:0 4px 18px rgba(108,59,255,.35);transition:transform .1s,opacity .15s;font-family:inherit;}
.btn-main:active{transform:scale(.98);opacity:.9;}
.auth-link{text-align:center;margin-top:18px;font-size:14px;color:var(--text-light);}
.auth-link a{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none;}
 
/* ── PROFILE HEADER ── */
.profile-hdr{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;padding:18px 18px 28px;position:relative;overflow:hidden;}
.profile-hdr::before{content:'';position:absolute;bottom:-40px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07);}
.profile-hdr::after{content:'';position:absolute;top:-20px;right:60px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.05);}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.hdr-brand{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.hdr-brand span{opacity:.7;}
.hdr-icon-btn{background:rgba(255,255,255,.18);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;}
.hdr-icon-btn svg{width:18px;height:18px;fill:currentColor;}
 
.user-row{display:flex;align-items:center;gap:13px;}
.avatar-ring{width:54px;height:54px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);overflow:hidden;flex-shrink:0;}
.avatar-ring img{width:100%;height:100%;object-fit:cover;}
.u-name{font-size:18px;font-weight:700;margin-bottom:3px;}
.vip-badge{display:inline-block;background:linear-gradient(90deg,#ffe566,var(--gold));color:#6b4400;font-size:10px;font-weight:700;font-style:italic;padding:2px 9px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.u-phone{font-size:12px;opacity:.75;margin-top:3px;}
 
/* ── WALLET CARD ── */
.wallet-card{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:var(--r);padding:15px;margin-top:15px;backdrop-filter:blur(6px);}
.w-lbl{font-size:12px;opacity:.8;margin-bottom:5px;}
.w-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;}
.w-amount{font-size:28px;font-weight:800;letter-spacing:-1px;}
.w-btns{display:flex;gap:8px;}
.w-btn{background:white;color:var(--text);border:none;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .1s;font-family:inherit;}
.w-btn.btn-w-ret{background:var(--accent);color:white;}
.w-btn:active{transform:scale(.95);}
.w-stats{display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.2);padding-top:11px;}
.ws-item{text-align:center;}
.ws-lbl{font-size:11px;opacity:.7;margin-bottom:3px;}
.ws-val{font-size:13px;font-weight:600;}
 
/* ── ANNOUNCE ── */
.announce{background:var(--white);padding:10px 15px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-mid);border-bottom:6px solid var(--bg);}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;animation:blink 1.6s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
 
/* ── SECTION BLOCK ── */
.sec{background:var(--white);padding:18px 16px;margin-bottom:8px;width:100%;}
.sec-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-title::before{content:'';width:4px;height:17px;background:var(--primary);border-radius:2px;flex-shrink:0;}
 
/* ── FAME LIST ── */
.fame-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.fame-item:last-child{border-bottom:none;}
.fi-left{display:flex;align-items:center;gap:10px;}
.fi-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary-pale));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--primary);}
.fi-name{font-size:14px;font-weight:500;color:var(--text);}
.fi-act{font-size:12px;color:var(--text-light);margin-top:1px;}
.fi-amt{font-size:15px;font-weight:700;color:var(--green);}
 
/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:480px;background:var(--white);border-top:1px solid var(--border);display:none;justify-content:space-around;padding:6px 0 8px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.06);}
.nav-btn{display:flex;flex-direction:column;align-items:center;background:none;border:none;cursor:pointer;color:var(--text-light);font-size:11px;font-family:inherit;padding:4px 0;width:25%;transition:color .15s;}
.nav-btn.active{color:var(--primary);}
.nav-btn svg{width:22px;height:22px;fill:currentColor;margin-bottom:2px;}
.nb-dot{width:4px;height:4px;border-radius:50%;background:var(--primary);margin:2px auto 0;display:none;}
.nav-btn.active .nb-dot{display:block;}
 
/* ── SUB HEADER ── */
.sub-hdr{display:flex;align-items:center;height:52px;background:var(--white);border-bottom:1px solid var(--border);padding:0 15px;position:relative;flex-shrink:0;}
.sub-hdr-title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;color:var(--text);}
 
/* ── GRAB VIEW ── */
.grab-banner{height:170px;width:100%;overflow:hidden;background:linear-gradient(135deg,var(--primary-pale),var(--primary-light));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.grab-banner img{width:100%;height:100%;object-fit:contain;}
.grab-body{padding:15px;background:var(--bg);flex:1;width:100%;}
.btn-grab{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;width:100%;height:52px;border-radius:var(--r-sm);font-size:17px;font-weight:700;cursor:pointer;margin-bottom:14px;box-shadow:0 4px 18px rgba(108,59,255,.35);font-family:inherit;transition:transform .1s;}
.btn-grab:active{transform:scale(.98);}
.btn-grab:disabled{background:#cccccc;box-shadow:none;cursor:not-allowed;}
 
.grab-card{background:var(--white);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.grab-stats{display:flex;justify-content:space-around;margin-bottom:16px;}
.gs-item{text-align:center;}
.gs-lbl{font-size:12px;color:var(--text-light);margin-bottom:4px;}
.gs-val{font-size:18px;font-weight:700;color:var(--primary);}
.counter-row{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg);padding:12px;border-radius:var(--r-sm);font-size:14px;color:var(--text-light);}
 
.comm-card{background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.comm-hdr{padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-mid);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
.comm-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);}
.comm-row:last-child{border-bottom:none;}
.cm-user{font-size:14px;color:var(--text);font-weight:500;}
.cm-act{font-size:12px;color:var(--text-light);}
.cm-amt{font-size:14px;font-weight:700;color:var(--green);}
 
/* ── ORDERS ── */
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--border);width:100%;}
.tab{flex:1;padding:13px 0;font-size:14px;color:var(--text-light);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:500;position:relative;transition:color .15s;}
.tab.active{color:var(--primary);}
.tab.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:2.5px;background:var(--primary);border-radius:2px;}
.order-container{padding:12px;background:var(--bg);flex:1;display:flex;flex-direction:column;gap:12px;width:100%;}

.product-card{background:var(--white);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;}
.pc-top{display:flex;gap:12px;align-items:center;}
.pc-img-box{width:80px;height:80px;border-radius:var(--r-sm);border:1px solid var(--border);overflow:hidden;background:#f9f9f9;flex-shrink:0;}
.pc-img-box img{width:100%;height:100%;object-fit:cover;}
.pc-details{flex:1;}
.pc-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:4px;}
.pc-meta{font-size:11px;color:var(--text-light);}
.pc-prices{display:grid;grid-template-columns:1fr 1fr;background:var(--primary-pale);padding:10px;border-radius:var(--r-sm);margin-top:4px;}
.pc-p-box span{display:block;font-size:11px;color:var(--text-mid);}
.pc-p-box strong{font-size:14px;font-weight:700;}
.pc-p-box.cost strong{color:var(--text);}
.pc-p-box.comm strong{color:var(--green);}
.pc-actions{display:flex;justify-content:flex-end;margin-top:4px;}
.btn-submit-order{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(108,59,255,.25);font-family:inherit;}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);padding:40px 20px;}
.empty-state svg{width:54px;height:54px;fill:var(--text-light);opacity:.35;}
.empty-state p{color:var(--text-light);font-size:15px;}
 
/* ── RECHARGE & WITHDRAW GENERAL BODY ── */
.recharge-body, .withdraw-body{background:var(--bg);flex:1;padding:14px;width:100%;}
.pay-option-card{background:var(--white);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px;}
.pay-opt{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.pay-opt:last-child{border-bottom:none;}
.pay-opt.selected{background:var(--primary-pale);}
.pay-icon-box{width:42px;height:42px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pay-icon-box svg{width:22px;height:22px;fill:var(--primary);}
.pay-icon-box.accent-box{background:var(--accent-light);}
.pay-icon-box.accent-box svg{fill:var(--accent);}
.pay-txt{flex:1;}
.pay-name{font-size:15px;font-weight:600;color:var(--text);}
.pay-sub{font-size:12px;color:var(--text-light);margin-top:2px;}
.radio-circle{width:18px;height:18px;border-radius:50%;border:2px solid var(--primary);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.radio-circle.on::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--primary);}
.btn-confirm{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;width:100%;height:50px;border-radius:var(--r-sm);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 18px rgba(108,59,255,.3);font-family:inherit;transition:transform .1s;}
.btn-confirm.btn-accent{background:linear-gradient(135deg,var(--accent),#e0531b);box-shadow:0 4px 18px rgba(255,107,53,.3);}
.btn-confirm:active{transform:scale(.98);}
 
/* ── PAYMENT / WITHDRAW DETAILS ── */
.pd-scroll{flex:1;background:var(--bg);overflow-y:auto;width:100%;}
.alert-box{margin:14px;padding:13px 14px;background:#fffbeb;border-left:4px solid var(--gold);border-radius:var(--r-sm);}
.alert-box p{font-size:13px;color:#7c5a00;line-height:1.6;}
.amount-field{background:var(--white);padding:16px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.amount-field label{font-size:12px;color:var(--text-light);margin-bottom:6px;display:block;}
.amount-field input{width:100%;border:none;outline:none;font-size:22px;font-weight:700;color:var(--primary);font-family:inherit;}
.amount-field input::placeholder{font-size:16px;font-weight:400;color:var(--text-light);}
 
/* Formularios Card */
.form-card{margin:14px;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:4px;}
.form-card h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px;}

/* QR / Yape card */
.yape-card{margin:14px;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.yape-hdr{padding:13px 16px;background:var(--bg);font-size:14px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.yape-hdr-logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#4e22e0);display:flex;align-items:center;justify-content:center;}
.yape-hdr-logo svg{width:16px;height:16px;fill:white;}
.qr-wrap{padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.qr-box{width:160px;height:160px;border:3px solid var(--primary-light);border-radius:14px;background:var(--primary-pale);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:12px;text-align:center;padding:10px;font-weight:500;}
.yape-number{font-size:22px;font-weight:800;color:var(--text);letter-spacing:1px;}
.yape-name{font-size:14px;color:var(--text-mid);font-weight:500;}
.btn-copy-pill{background:var(--primary-light);color:var(--primary);border:none;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn-copy-pill:active{background:var(--primary);color:white;}
 
.submit-wrap{padding:0 14px 20px;}
 
/* ── MÍO ── */
.mio-body{background:var(--bg);flex:1;padding:14px;width:100%;}
.wallet-tile{background:var(--white);border-radius:var(--r);padding:18px;display:flex;justify-content:space-between;align-items:center;margin-top:-20px;position:relative;z-index:5;box-shadow:var(--shadow-md);margin-bottom:14px;}
.wt-lbl{font-size:12px;color:var(--text-light);margin-bottom:4px;}
.wt-amt{font-size:26px;font-weight:800;color:var(--primary);}
.btn-withdraw-tile{background:linear-gradient(135deg,var(--accent),#e0531b);color:white;border:none;height:40px;padding:0 22px;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
 
.opts-grid{background:var(--white);border-radius:var(--r);padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:var(--shadow);}
.opt{display:flex;flex-direction:column;align-items:center;padding:16px 8px;border-radius:10px;cursor:pointer;transition:background .15s;}
.opt:hover{background:var(--primary-pale);}
.opt-ico{width:46px;height:46px;border-radius:14px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.opt-ico svg{width:22px;height:22px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.opt-lbl{font-size:11px;color:var(--text-mid);text-align:center;line-height:1.3;font-weight:500;}
 
/* ── TOAST ── */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(22,20,43,.88);color:white;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- ... Las vistas se mantienen ... -->

<!-- AGREGAMOS AL FINAL LA LÓGICA DE INICIO DE SESIÓN CONECTADA AL SERVIDOR -->
<script>
  function showView(viewId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(viewId);
    if(target) target.classList.add('active');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function handleLogin(e) {
    e.preventDefault();
    const phone = document.getElementById('loginPhone').value.trim();
    const pass = document.getElementById('loginPass').value.trim();

    try {
      // Conecta con las rutas del backend en Render
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password: pass })
      });
      const data = await res.json();

      if (res.ok) {
        showToast(`¡Bienvenido de vuelta, ${data.user.name}!`);
        document.querySelectorAll('.display-name').forEach(el => el.innerText = data.user.name);
        document.getElementById('home-balance').innerText = `S/ ${parseFloat(data.user.balance).toFixed(2)}`;
        showView('home-view');
      } else {
        showToast(data.message || 'Datos incorrectos');
      }
    } catch (err) {
      showToast('Error conectando al servidor');
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    showToast('Registro de prueba exitoso. Inicia sesión.');
    showView('login-view');
  }
</script>
</body>
</html>
